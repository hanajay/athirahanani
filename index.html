<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pengurusan e-Kemunting Pro</title>
  
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- CDN Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <!-- Header / Navigation -->
  <header class="bg-indigo-700 text-white shadow-md p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold tracking-wide">e-Kemunting Pro</h1>
      <span class="text-xs md:text-sm bg-indigo-800 px-3 py-1 rounded-full text-indigo-200">
        Fasa 3: Pangkalan Data Realtime
      </span>
    </div>
  </header>

  <!-- Content Container -->
  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Borang Input Murid -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold text-slate-700 border-b pb-2 mb-4">
        Borang Pendaftaran Murid
      </h2>

      <form id="studentForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Nama Murid</label>
          <input type="text" id="nama" required placeholder="Contoh: Ahmad Ammar" 
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Kelas</label>
          <input type="text" id="kelas" required placeholder="Contoh: 5 Cemerlang" 
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Status Kehadiran / Catatan</label>
          <input type="text" id="catatan" placeholder="Contoh: Hadir / Bersebab" 
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="md:col-span-3 flex justify-end">
          <button type="submit" 
                  class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg transition shadow">
            Simpan Rekod
          </button>
        </div>
      </form>
    </section>

    <!-- Senarai Data Murid -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 class="text-lg font-semibold text-slate-700">Senarai Murid</h2>
        <button onclick="fetchStudents()" class="text-sm text-indigo-600 hover:underline">
          Muat Semula
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-600 border-b">
              <th class="p-3">Nama</th>
              <th class="p-3">Kelas</th>
              <th class="p-3">Catatan</th>
              <th class="p-3 text-center">Tindakan</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="4" class="p-4 text-center text-slate-400">Memuatkan data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Script Supabase & Logic -->
  <script>
    // Konfigurasi Supabase Cikgu
    const SUPABASE_URL = 'https://vsrhclpbwuhtvxrtydgs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_63UGYbCjW_fVSoVRT5tmgQ_Nx4nzr41';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Ambil Data Murid Dari Supabase
    async function fetchStudents() {
      const { data, error } = await db.from('murid').select('*').order('created_at', { ascending: false });
      
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';

      if (error) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Ralat: ${error.message}</td></tr>`;
        return;
      }

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Tiada rekod disimpan lagi.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const row = document.createElement('tr');
        row.className = "hover:bg-slate-50";
        row.innerHTML = `
          <td class="p-3 font-medium">${item.nama}</td>
          <td class="p-3 text-slate-600">${item.kelas}</td>
          <td class="p-3 text-slate-600">${item.catatan || '-'}</td>
          <td class="p-3 text-center">
            <button onclick="deleteStudent(${item.id})" class="text-red-500 hover:text-red-700 text-sm font-medium">
              Padam
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Tambah Data Murid
    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nama = document.getElementById('nama').value;
      const kelas = document.getElementById('kelas').value;
      const catatan = document.getElementById('catatan').value;

      const { error } = await db.from('murid').insert([{ nama, kelas, catatan }]);

      if (error) {
        alert('Gagal menyimpan: ' + error.message);
      } else {
        document.getElementById('studentForm').reset();
        fetchStudents();
      }
    });

    // Padam Data Murid
    async function deleteStudent(id) {
      if (confirm('Adakah anda pasti mahu memadam rekod ini?')) {
        const { error } = await db.from('murid').delete().eq('id', id);
        if (error) alert('Gagal memadam: ' + error.message);
        else fetchStudents();
      }
    }

    // Muat data bila halaman dibuka
    fetchStudents();
  </script>
</body>
</html>
