<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul Kehadiran — e-Kemunting Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f4f5f7; padding: 20px; color: #333; }
        .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 900px; margin: 0 auto; border: 1px solid #e2e8f0; }
        .header-print { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e40af; padding-bottom: 12px; margin-bottom: 20px; }
        h2 { color: #1e40af; font-size: 20px; }
        .meta-info { font-size: 13px; color: #64748b; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px 12px; text-align: left; font-size: 13px; }
        th { background: #f1f5f9; color: #1e293b; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #1e40af; color: white; }
        .btn-success { background: #16a34a; color: white; }
        .btn-print { background: #0f172a; color: white; }
        .actions { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
        
        /* CSS rekaan khas untuk hasil cetakan RPH */
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .card { border: none; max-width: 100%; width: 100%; padding: 0; }
            h2 { color: black; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-print">
        <div>
            <h2>BORANG KEHADIRAN & ANALISIS HARIAN</h2>
            <p style="font-size: 12px; color: #64748b;">SMK Paya Kemunting • Guru: Cikgu Athira</p>
        </div>
        <button onclick="window.print()" class="btn btn-print no-print"><i class="fa-solid fa-print"></i> Cetak / Simpan PDF (RPH)</button>
    </div>

    <div class="meta-info">
        <strong>Tarikh:</strong> <input type="date" id="tarikh" class="no-print" style="padding:4px; border-radius:4px; border:1px solid #ccc;"> <span id="txt-tarikh"></span> | 
        <strong>Kelas:</strong> 3 Gamma
    </div>

    <table id="jadualKehadiran">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Murid</th>
                <th>Status Kehadiran</th>
                <th>Catatan</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Ahmad Afiq bin Rosli</td>
                <td>
                    <select class="status-select">
                        <option value="Hadir">Hadir</option>
                        <option value="Tidak Hadir">Tidak Hadir</option>
                        <option value="Lewat">Lewat</option>
                    </select>
                </td>
                <td><input type="text" placeholder="-"></td>
            </tr>
            <tr>
                <td>2</td>
                <td>Nur Aina Insyirah binti Hazmi</td>
                <td>
                    <select class="status-select">
                        <option value="Hadir">Hadir</option>
                        <option value="Tidak Hadir">Tidak Hadir</option>
                        <option value="Lewat">Lewat</option>
                    </select>
                </td>
                <td><input type="text" placeholder="-"></td>
            </tr>
        </tbody>
    </table>

    <div style="margin-top: 20px; background: #eff6ff; padding: 12px; border-radius: 8px; border: 1px solid #bfdbfe;">
        <strong>Peratus Kehadiran Hari Ini: </strong> <span id="peratusVal" style="font-size: 18px; color: #1e40af; font-weight: bold;">100%</span>
    </div>

    <div class="actions no-print">
        <a href="index.html" class="btn" style="background:#e2e8f0; text-decoration:none; color:#333;">← Kembali ke Dashboard</a>
        <button onclick="simpanKehadiran()" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Kemaskini & Simpan</button>
    </div>
</div>

<script>
    function simpanKehadiran() {
        alert('Rekod kehadiran berjaya dikemas kini untuk RPH!');
    }
</script>

</body>
</html>
